# OpsMonitor 运维监控系统 - Docker Compose 部署
# 适用于 1Panel / 原生 Docker 环境
#
# 使用方式：
#   1. 在项目根目录（opsmonitor-opensource/）执行：docker-compose -f deploy/docker-compose.yml up -d
#   2. 修改 deploy/.env 中的数据库和密码配置
#   3. 首次部署需先导入 SQL：见 deploy/start.sh 中的 init 步骤

version: "3.8"

services:
  opsmonitor-server:
    build:
      context: ..
      dockerfile: deploy/server/Dockerfile
    container_name: opsmonitor-server
    restart: always
    ports:
      - "${SERVER_PORT:-9999}:9999"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-wgcloud}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - WGTOKEN=${WGTOKEN:-opsmonitor}
      - TZ=Asia/Shanghai
    volumes:
      - ./server/logs:/app/logs
      - ./server/config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9999/opsmonitor/login/toLogin || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - opsmonitor-net

  opsmonitor-agent:
    build:
      context: ..
      dockerfile: deploy/agent/Dockerfile
    container_name: opsmonitor-agent
    restart: always
    depends_on:
      - opsmonitor-server
    environment:
      - SERVER_URL=${SERVER_URL:-http://opsmonitor-server:9999}
      - BIND_IP=${BIND_IP:-}
      - WGTOKEN=${WGTOKEN:-opsmonitor}
      - TZ=Asia/Shanghai
    volumes:
      - ./agent/logs:/app/logs
      - ./agent/config:/app/config
    # Agent 需要访问宿主机资源（CPU/内存/磁盘）
    # 在 Linux 上需要额外权限
    pid: host
    cap_add:
      - SYS_PTRACE
    networks:
      - opsmonitor-net

networks:
  opsmonitor-net:
    driver: bridge
