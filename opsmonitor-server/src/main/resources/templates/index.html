<!DOCTYPE html>
<html>
<head>
  <div  th:replace="common/header.html"></div>


</head>
<body class="hold-transition sidebar-mini layout-fixed">

<div class="wrapper">

  <div th:replace="common/navbar.html"></div>

  <div th:replace="common/aside.html"></div>


  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper" style="font-size: 0.9rem">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
          </div><!-- /.col -->
         <!-- <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
              <li class="breadcrumb-item active">Dashboard v1</li>
            </ol>
          </div>--><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
                <!-- 系统概览欢迎横幅 -->
        <div class="row">
          <div class="col-12">
            <div class="ops-welcome-banner mb-3">
              <div class="d-flex flex-wrap align-items-center justify-content-between">
                <div>
                  <h4 class="mb-1" style="font-weight:700;"><i class="fas fa-server mr-2" style="color:#a5b4fc;"></i>OpsMonitor 监控总览</h4>
                  <p class="mb-0" style="color:var(--ops-text-dim);font-size:.85rem;">实时掌握全栈资源与服务状态，数据自动刷新中</p>
                </div>
                <div class="d-flex mt-2 mt-md-0">
                  <div class="text-center px-3" style="border-right:1px solid var(--ops-border);">
                    <div style="font-size:1.4rem;font-weight:700;color:#a5b4fc;" th:text="${totalSystemInfoSize}">0</div>
                    <div style="font-size:.75rem;color:var(--ops-text-dim);">监控主机</div>
                  </div>
                  <div class="text-center px-3" style="border-right:1px solid var(--ops-border);">
                    <div style="font-size:1.4rem;font-weight:700;color:#34d399;" th:text="${heath200Size}">0</div>
                    <div style="font-size:.75rem;color:var(--ops-text-dim);">健康接口</div>
                  </div>
                  <div class="text-center px-3">
                    <div style="font-size:1.4rem;font-weight:700;color:#fbbf24;" th:text="${logSize}">0</div>
                    <div style="font-size:.75rem;color:var(--ops-text-dim);">系统日志</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 指标卡片 -->
        <div class="row">
          <div class="col-lg-3 col-6">
            <div class="small-box bg-info">
              <div class="inner">
                <h3 th:text="${totalSizeApp}"></h3>
                <p>监控进程</p>
              </div>
              <div class="icon"><i class="fas fa-cubes"></i></div>
              <a th:href="@{'/appInfo/list'}" class="small-box-footer">查看详情 <i class="fas fa-arrow-circle-right"></i></a>
            </div>
          </div>
          <div class="col-lg-3 col-6">
            <div class="small-box bg-warning">
              <div class="inner">
                <h3 th:text="${memPerSizeApp}"></h3>
                <p>进程CPU>90%</p>
              </div>
              <div class="icon"><i class="fas fa-fire"></i></div>
              <a th:href="@{'/appInfo/list'}" class="small-box-footer">查看详情 <i class="fas fa-arrow-circle-right"></i></a>
            </div>
          </div>
          <div class="col-lg-3 col-6">
            <div class="small-box bg-indigo">
              <div class="inner">
                <h3 th:text="${dbInfoSize}"></h3>
                <p>数据源</p>
              </div>
              <div class="icon"><i class="fas fa-database"></i></div>
              <a th:href="@{'/dbInfo/list'}" class="small-box-footer">查看详情 <i class="fas fa-arrow-circle-right"></i></a>
            </div>
          </div>
          <div class="col-lg-3 col-6">
            <div class="small-box bg-teal">
              <div class="inner">
                <h3 th:text="${dbTableSize}"></h3>
                <p>监控数据表</p>
              </div>
              <div class="icon"><i class="fas fa-table"></i></div>
              <a th:href="@{'/dbTable/list'}" class="small-box-footer">查看详情 <i class="fas fa-arrow-circle-right"></i></a>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-lg-3 col-6">
            <div class="small-box bg-info">
              <div class="inner">
                <h3 th:text="${dbTableSum}"></h3>
                <p>数据表总数据量</p>
              </div>
              <div class="icon"><i class="fas fa-chart-bar"></i></div>
              <a th:href="@{'/dbTable/list'}" class="small-box-footer">查看详情 <i class="fas fa-arrow-circle-right"></i></a>
            </div>
          </div>
          <div class="col-lg-3 col-6">
            <div class="small-box bg-indigo">
              <div class="inner">
                <h3 th:text="${heathSize}"></h3>
                <p>服务接口</p>
              </div>
              <div class="icon"><i class="fas fa-plug"></i></div>
              <a th:href="@{'/heathMonitor/list'}" class="small-box-footer">查看详情 <i class="fas fa-arrow-circle-right"></i></a>
            </div>
          </div>
          <div class="col-lg-3 col-6">
            <div class="small-box bg-danger">
              <div class="inner">
                <h3 th:text="${heatherrSize}"></h3>
                <p>异常服务接口</p>
              </div>
              <div class="icon"><i class="fas fa-exclamation-triangle"></i></div>
              <a th:href="@{'/heathMonitor/list'}" class="small-box-footer">查看详情 <i class="fas fa-arrow-circle-right"></i></a>
            </div>
          </div>
          <div class="col-lg-3 col-6">
            <div class="small-box bg-success">
              <div class="inner">
                <h3 th:text="${logSize}"></h3>
                <p>系统日志</p>
              </div>
              <div class="icon"><i class="fas fa-scroll"></i></div>
              <a th:href="@{'/log/list'}" class="small-box-footer">查看详情 <i class="fas fa-arrow-circle-right"></i></a>
            </div>
          </div>
        </div>
<!-- Main row -->
        <div class="row">
          <!-- Left col -->
          <section class="col-lg-7 connectedSortable">
            <!-- Custom tabs (Charts with tabs)-->
            <div class="card" id="chartInfoList">

            </div>
            <!-- /.card -->
          </section>
          <section class="col-lg-5 connectedSortable ui-sortable">
            <div class="card" id="dbTableList">

            </div>
          </section>
        </div>


      </div><!-- /.container-fluid -->
    </section>
    <!-- /.content -->
  </div>
  <div th:replace="common/chart.html"></div>
  <div th:replace="common/footer.html"></div>

</div>
<!-- ./wrapper -->


<script th:inline="javascript">

  const data = [[${chartInfoList}]];

  const chart = new G2.Chart({
    container: 'chartInfoList',
    forceFit: true,
    height: 500,
    animate: false
  });
  chart.source(data, {
    percent: {
      formatter: val => {
      val = (val * 100) + '%';
  return val;
  }
  }
  });
  chart.coord('theta', {
    radius: 0.75,
    innerRadius: 0.6
  });
  chart.tooltip({
    showTitle: false,
    itemTpl: '<li><span style="background-color:{color};" class="g2-tooltip-marker"></span>{name}: {value}</li>'
  });
  // 辅助文本
  chart.guide().html({
    position: [ '50%', '50%' ],
    html: '<div style="color:#b7c0d6;font-size: 14px;text-align: center;width: 10em;">监控主机<br><span style="color:#b7c0d6;font-size:20px">[[${totalSystemInfoSize}]]</span>台</div>',
    alignX: 'middle',
    alignY: 'middle'
  });
  const interval = chart.intervalStack()
          .position('percent')
          .color('item')
          .label('count', {
            formatter: (val, item) => {
            return item.point.item + ': ' + val;
  }
  })
  .tooltip('item*percent', (item, percent) => {
    percent = percent * 100 + '%';
  return {
    name: item,
    value: percent
  };
  })
  .style({
    lineWidth: 1,
    stroke: '#fff'
  });
  chart.render();
  interval.setSelected(data[0]);

  const data2 = [[${dbTableList}]];
  const chart2 = new G2.Chart({
    container: 'dbTableList',
    forceFit: true,
    height: 500,
    padding: [ 20, 40, 50, 124 ]
  });
  chart2.source(data2, {
    value: {
      min: 0,
      nice: false,
      alias: '条'
    }
  });
  chart2.axis('tableName', {
    label: {
      textStyle: {
        fill: '#b7c0d6',
        fontSize: 12
      }
    },
    tickLine: {
      alignWithLabel: false,
      length: 0
    },
    line: {
      lineWidth: 0
    }
  });
  chart2.axis('value', {
    label: null,
    title: {
      offset: 30,
      textStyle: {
        fontSize: 12,
        fontWeight: 300
      }
    }
  });
  chart2.legend(false);
  chart2.coord().transpose();
  chart2.interval().position('tableName*value').size(26)
          .opacity(1)
          .label('value', {
            textStyle: {
              fill: '#b7c0d6'
            },
            offset: 10
          });
  chart2.render();
</script>
</body>
</html>
