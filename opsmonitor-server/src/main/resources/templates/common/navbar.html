<script>
(function() {
    // 顶栏时钟
    function tick() {
        var el = document.getElementById('opsClock');
        if (!el) return;
        var d = new Date();
        function p(n){ return (n<10?'0':'')+n; }
        el.textContent = d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
    }
    tick();
    setInterval(tick, 1000);
})();
function opsGlobalSearch() {
    var v = document.getElementById('globalSearchInput') ? document.getElementById('globalSearchInput').value.trim() : '';
    if (!v) return false;
    window.location.href = (window.opsCtxPath||'/opsmonitor') + '/dash/systemInfoList?hostName=' + encodeURIComponent(v);
    return false;
}
</script>
