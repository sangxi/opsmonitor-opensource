<!DOCTYPE html>
<html>
<head>
  <div  th:replace="common/header.html"></div>


</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div th:replace="common/chart.html"></div>

<div class="wrapper">

  <div th:replace="common/navbar.html"></div>

  <div th:replace="common/aside.html"></div>

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper" style="font-size: 0.9rem">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1></h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"></li>
            </ol>
          </div>
        </div>
      </div><!-- /.container-fluid -->
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">

  <div class="col-md-12">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">服务接口列表</h3>
        <div class=" float-sm-right">
          <button type="button" onclick="add()" class="btn btn-block btn-primary btn-sm">添加</button>
        </div>
      </div>
      <!-- /.card-header -->
      <div class="card-body">
        <!-- 筛选条件：与列表查询参数一一对应 -->
        <form class="form-inline mb-2" method="get" action="/heathMonitor/list">
          <div class="form-group mr-2">
            <input type="text" class="form-control form-control-sm" name="appName" placeholder="服务名称"
                   th:value="${queryAppName}" style="width: 160px">
          </div>
          <div class="form-group mr-2">
            <select class="form-control form-control-sm" name="monitorType" style="width: 120px">
              <option value="">全部类型</option>
              <option value="1" th:selected="${queryMonitorType eq '1'}">HTTP 接口</option>
              <option value="2" th:selected="${queryMonitorType eq '2'}">TCP 端口</option>
            </select>
          </div>
          <div class="form-group mr-2">
            <select class="form-control form-control-sm" name="heathStatus" style="width: 120px">
              <option value="">全部状态</option>
              <option value="200" th:selected="${queryHeathStatus eq '200'}">正常 (200)</option>
              <option value="other" th:selected="${queryHeathStatus eq 'other'}">异常</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary btn-sm mr-2">查询</button>
          <a class="btn btn-default btn-sm" href="/heathMonitor/list">重置</a>
        </form>
        <table class="table table-bordered">
          <thead>
          <tr>
            <th style="width: 80px">序号</th>
            <th>服务名称</th>
            <th>监控类型</th>
            <th>监控目标</th>
            <th>响应状态</th>
            <th>更新时间</th>
              <th>操作</th>
          </tr>
          </thead>
          <tbody>
          <th:block th:each="item,iterStat : ${page.list}">
            <tr>
              <td th:text="${iterStat.index+1}">1</td>
              <td th:text="${item.appName}">Update software</td>
              <td>
                <th:block th:if="${item.monitorType eq '2'}">
                  <span class="badge badge-info">TCP 端口</span>
                </th:block>
                <th:block th:unless="${item.monitorType eq '2'}">
                  <span class="badge badge-secondary">HTTP 接口</span>
                </th:block>
              </td>
              <td>
                <th:block th:if="${item.monitorType eq '2'}">
                  <span th:text="${item.hostIp + ':' + item.port}"></span>
                </th:block>
                <th:block th:unless="${item.monitorType eq '2'}">
                  <span th:text="${item.heathUrl}"></span>
                </th:block>
              </td>
              <td>

                <th:block th:if="${item.heathStatus eq '200'}">
                  <span class="badge bg-primary" th:text="${item.heathStatus}"></span>
                </th:block>
                <th:block th:unless="${item.heathStatus eq '200'}">
                  <span class="badge bg-danger" th:text="${item.heathStatus}"></span>
                </th:block>
              </td>

              <td th:text="${#dates.format(item.createTime,'yyyy-MM-dd HH:mm:ss')}">Update software</td>
              <td>
                <button type="button"  th:onclick="del([[${item.id}]])"  class="btn bg-gradient-danger btn-sm">删除</button>
                <button type="button"  th:onclick="edit([[${item.id}]])"  class="btn bg-gradient-primary btn-sm">编辑</button>
              <button type="button"  th:onclick="view([[${item.id}]])"  class="btn bg-gradient-primary btn-sm">查看</button></td>
            </tr>
          </th:block>

          </tbody>
        </table>
      </div>
      <!-- /.card-body -->
      <div th:replace="common/page.html"></div>
    </div>
    <!-- /.card -->


  </div>

        </div>
      </div>
    </section>
  </div>


  <div th:replace="common/footer.html"></div>

</div>
<!-- ./wrapper -->

<script th:src="@{'/static/js/heath.js'}"></script>

</body>
</html>
