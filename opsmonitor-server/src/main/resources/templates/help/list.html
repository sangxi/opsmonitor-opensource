<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <div th:replace="common/header.html"></div>
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <div th:replace="common/navbar.html"></div>
  <div th:replace="common/aside.html"></div>

  <!-- Content Wrapper -->
  <div class="content-wrapper">
    <!-- Content Header -->
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1><i class="fas fa-book-open"></i> 使用教程</h1>
          </div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a th:href="@{'/'}">首页</a></li>
              <li class="breadcrumb-item active">使用教程</li>
            </ol>
          </div>
        </div>
      </div>
    </section>

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <div class="row">

          <!-- 左侧分类导航 -->
          <div class="col-md-3">
            <div class="ops-help-category card">
              <div class="card-header">
                <h3 class="card-title"><i class="fas fa-th-large"></i> &nbsp;教程分类</h3>
              </div>
              <div class="card-body p-0">
                <ul class="nav nav-pills flex-column ops-help-nav" id="helpCategoryNav">
                  <li class="nav-item" th:each="cat : ${categoryList}">
                    <a th:href="@{'/help/list?category=' + ${cat.id}}"
                       class="nav-link"
                       th:classappend="${cat.id == activeCategory ? 'active' : ''}">
                      <i th:class="${cat.icon}"></i>
                      <span th:text="${cat.name}">分类</span>
                    </a>
                  </li>
                </ul>
              </div>
              <div class="card-footer ops-help-tip">
                <i class="fas fa-lightbulb"></i> &nbsp;涵盖各系统部署、文件挂载清单、告警配置与 FAQ
              </div>
            </div>
          </div>

          <!-- 右侧文章列表 -->
          <div class="col-md-9">
            <div class="ops-help-list">
              <!-- 空态 -->
              <div class="card" th:if="${#lists.isEmpty(helpList)}">
                <div class="card-body text-center py-5">
                  <i class="fas fa-folder-open ops-empty-icon"></i>
                  <p class="mt-3 text-muted">该分类下暂无教程</p>
                </div>
              </div>

              <!-- 文章卡片 -->
              <div class="card" th:each="help : ${helpList}">
                <div class="card-body ops-help-item">
                  <div class="ops-help-item-icon">
                    <i class="fas fa-file-alt"></i>
                  </div>
                  <div class="ops-help-item-body">
                    <h5 class="card-title">
                      <a th:href="@{'/help/view?id=' + ${help.id}}" th:text="${help.title}">教程标题</a>
                    </h5>
                    <p class="ops-help-item-meta">
                      <span class="badge ops-badge-cat" th:text="${help.categoryName}">分类</span>
                      <span th:if="${help.createTime != null}" th:text="${#dates.format(help.createTime, 'yyyy-MM-dd HH:mm')}">时间</span>
                    </p>
                    <div class="ops-help-item-desc" th:text="${#strings.abbreviate(help.content, 160)}">摘要</div>
                    <a class="btn btn-sm ops-help-read-btn" th:href="@{'/help/view?id=' + ${help.id}}">
                      阅读全文 <i class="fas fa-arrow-right"></i>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <div th:replace="common/footer.html"></div>
</div>

<!-- jQuery -->
<script th:src="@{'/static/AdminLTE/plugins/jquery/jquery.min.js'}"></script>
<!-- Bootstrap 4 -->
<script th:src="@{'/static/AdminLTE/plugins/bootstrap/js/bootstrap.bundle.min.js'}"></script>
<!-- AdminLTE App -->
<script th:src="@{'/static/AdminLTE/dist/js/adminlte.min.js'}"></script>
</body>
</html>
