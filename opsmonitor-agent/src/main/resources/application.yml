server:
  port: 9998
  servlet:
    context-path: /opsmonitor-agent
spring:
  application:
    name: opsmonitor-agent
#日志文件输出路径
logging:
  file:
    path: ./log

#自定义配置参数
base:
  #opsmonitor-server 端访问地址
  serverUrl: http://localhost:9999
  #本机ip，不要用localhost或127.0.0.1，不要重复
  bindIp: 192.168.1.2
  #通信token，请和server端配置文件里的omToken保持一致
  omToken: opsmonitor